[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helixwm-reference"
version = "0.1.0"
description = "Principles-first reference core for real-error-calibrated imagination"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.6,<3"]

[project.optional-dependencies]
experiment = ["numpy==2.2.6", "dm-control==1.0.28", "mujoco==3.3.0", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "matplotlib==3.10.3", "pillow==11.2.1"]

[tool.setuptools.packages.find]
include = ["helixwm*"]
