[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helixwm-reference"
version = "0.1.0"
description = "Principles-first reference core for real-error-calibrated imagination"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["helixwm*"]
